# baca: session picker for herdr. Lists Claude Code and OpenCode sessions (history from memex,
# liveness from herdr), focuses a live one or resumes a past one where you choose.
id = "hhj.baca"
name = "baca"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]
description = "Session picker: switch to live agent sessions or resume past Claude Code / OpenCode ones (via memex)."

# The command resolves against the pane's cwd, not the plugin root, hence the absolute path.
[[panes]]
id = "picker"
title = "baca"
placement = "popup"
width = "90%"
height = "85%"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/picker.sh\""]

[[actions]]
id = "open"
title = "baca: sessions"
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin hhj.baca --entrypoint picker --focus"]

# Live sessions by last focus, previous one preselected: an alt-tab over agent sessions.
[[actions]]
id = "recent"
title = "baca: recent sessions"
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin hhj.baca --entrypoint picker --env BACA_MODE=recent --focus"]

# Switch to the JetBrains IDE window for the focused pane's project.
[[actions]]
id = "ide"
title = "baca: focus IDE window"
contexts = ["global", "workspace", "tab", "pane"]
command = ["bash", "bin/ide.sh", "--focus"]

[[actions]]
id = "index"
title = "baca: refresh memex index"
command = ["bash", "bin/index.sh"]

# Feeds the focus log behind "recent" ordering.
[[events]]
on = "pane.focused"
command = ["bash", "bin/track.sh"]
